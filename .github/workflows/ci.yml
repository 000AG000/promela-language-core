name: Build and test ProMeLa WASM
on:
  push:
  pull_request:
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run setup
      - run: npm run audit
      - run: npm run test:package
      - run: npm pack --dry-run ./release/promela-language-core
      # Publication gate: commit package-lock.json and replace npm install with npm ci.
