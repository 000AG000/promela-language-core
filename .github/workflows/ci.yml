name: Build and test ProMeLa WASM
on:
  push:
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # CI deliberately requires a committed package-lock.json.
      # Before creating a public repository, run npm install locally, commit
      # package-lock.json and verify npm ci on a fresh checkout.
      - run: npm ci --no-audit --no-fund
      - run: npm run check:lock
      - run: npm run check:quality
      - run: npm run test:all
      - run: npm run audit
      - run: npm pack --dry-run ./release/promela-language-core
      # Prettier is opt-in until the existing source is formatted in a
      # separate reviewable change; then add 'npm run format:check' here.
